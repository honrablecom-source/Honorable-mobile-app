name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "Honorable-mobile-app-main/mobile-react-native/**"
      - "Honorable-mobile-app-main/android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "Honorable-mobile-app-main/mobile-react-native/**"
      - "Honorable-mobile-app-main/android-app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Honorable-mobile-app-main/mobile-react-native
    env:
      HONORABLE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HONORABLE_GOOGLE_WEB_CLIENT_ID }}
      HONORABLE_ACCOUNT_API_URL: ${{ secrets.HONORABLE_ACCOUNT_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Honorable-mobile-app-main/mobile-react-native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Report optional sign-in configuration
        shell: bash
        run: |
          if [[ -n "$HONORABLE_GOOGLE_WEB_CLIENT_ID" && -n "$HONORABLE_ACCOUNT_API_URL" ]]; then
            echo "Building with Google sign-in and account API configuration."
          else
            echo "::notice::Sign-in secrets are not configured; building the debug APK without sign-in configuration."
          fi
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        working-directory: Honorable-mobile-app-main/mobile-react-native/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK package and report signing SHA-1
        working-directory: Honorable-mobile-app-main/mobile-react-native/android
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-1 digest: /GitHub Actions APK signing SHA-1: /p'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -q "package: name='com.honorablemobile'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: honorable-android-debug
          retention-days: 14
          path: Honorable-mobile-app-main/mobile-react-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
