name: React Native checks

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-react-native/**"
      - ".github/workflows/react-native-checks.yml"
  pull_request:
    paths:
      - "mobile-react-native/**"
      - ".github/workflows/react-native-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-react-native/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
