name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon test
      - name: Build unsigned hardened release
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Verify release contents
        run: ./scripts/verify-release.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: honorable-android-unsigned-release
          retention-days: 14
          path: |
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Retain R8 mapping for trusted builds
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: honorable-r8-mapping-${{ github.sha }}
          retention-days: 14
          path: android-app/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
