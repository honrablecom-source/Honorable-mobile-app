name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-react-native/**"
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile-react-native/**"
      - "android-app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-react-native
    env:
      HONORABLE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HONORABLE_GOOGLE_WEB_CLIENT_ID }}
      HONORABLE_ACCOUNT_API_URL: ${{ secrets.HONORABLE_ACCOUNT_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-react-native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify sign-in build configuration is present
        shell: bash
        run: |
          test -n "$HONORABLE_GOOGLE_WEB_CLIENT_ID"
          test -n "$HONORABLE_ACCOUNT_API_URL"
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Build configured debug APK
        working-directory: mobile-react-native/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload configured debug APK
        uses: actions/upload-artifact@v4
        with:
          name: honorable-android-debug
          retention-days: 14
          path: mobile-react-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
